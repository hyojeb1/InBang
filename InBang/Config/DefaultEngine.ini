; ── 툰 방송용 경량 렌더링 ──────────────────────────────────────
; 툰 셰이딩은 조명을 머티리얼이 직접 계산하므로 Lumen/VSM/레이트레이싱이 필요 없다.
; 아껴진 GPU는 같은 PC의 OBS NVENC 인코딩 몫. 사실적인 무대가 필요해지면
; DynamicGlobalIlluminationMethod=1, ReflectionMethod=1 (Lumen)로 되돌리면 됨.
[/Script/Engine.RendererSettings]
; GI 없음 (0=None, 1=Lumen)
r.DynamicGlobalIlluminationMethod=0
; 반사는 저렴한 스크린 스페이스만 (0=None, 1=Lumen, 2=SSR)
r.ReflectionMethod=2
; 가상 섀도우맵 대신 일반 섀도우맵 (작은 무대엔 충분)
r.Shadow.Virtual.Enable=0
; 디스턴스 필드는 Lumen/DF 그림자용이라 불필요
r.GenerateMeshDistanceFields=False
r.AllowStaticLighting=False
; 레이트레이싱 끔
r.RayTracing=False
; 모프타겟/RigLogic이 많은 MetaHuman 얼굴은 GPU 스킨 캐시가 유리
r.SkinCache.CompileShaders=True
; 방송 화면 밝기가 장면마다 출렁이지 않도록 자동 노출 끔, 모션블러 끔 (툰 외곽선 번짐 방지)
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=False

